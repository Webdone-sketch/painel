<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1b1a17;--mut:#7c776a;--line:#e6e1d5;--acc:#e8a800;--ok:#2f8f4e;--bad:#c63c2e;--soft:#faf8f2}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--card:#1f1e1b;--ink:#f2efe6;--mut:#9d988b;--line:#33312c;--acc:#f2c033;--ok:#4cc27a;--bad:#ea6a5b;--soft:#191816}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}
h1{margin:0;font-size:22px;letter-spacing:-.5px;flex:1}h1 span{color:var(--acc)}
.pill{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}.pill.on i{background:var(--ok)}.pill.err i{background:var(--bad)}
.kpis{max-width:760px;margin:10px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:16px;white-space:nowrap}.kpi.lu b{color:var(--ok)}.kpi.lu.neg b{color:var(--bad)}.kpi span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
main{max-width:760px;margin:auto;padding:14px 12px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}section{min-width:0}
@media(min-width:720px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.wide{grid-column:1/-1}}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px}
h2{margin:2px 4px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);display:flex;justify-content:space-between}
h2 em{font-style:normal;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600}
.row{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);min-height:46px}
.row:last-child{border-bottom:0}
input,select,textarea{font:inherit;color:inherit;background:transparent;border:0;border-radius:8px;padding:10px 6px;min-width:0}
input[type=text]{flex:1}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);background:var(--soft)}
input.num{width:84px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
input.ord{width:38px;text-align:center;flex:none;color:var(--mut);font-size:14px}
input.who{flex:.7;color:var(--mut)}
select{flex:none;max-width:44%;color:var(--mut);font-size:14px;padding-right:2px}
input[type=checkbox]{width:22px;height:22px;margin:0 6px;accent-color:var(--ok);flex:none}
.row.done input[type=text]{text-decoration:line-through;color:var(--mut)}
.eur{color:var(--mut);margin-right:2px}
.del{flex:none;width:36px;height:36px;border:0;background:none;color:var(--mut);border-radius:8px;font-size:15px;cursor:pointer;opacity:.55}
.del.arm{opacity:1;background:var(--bad);color:#fff;width:auto;padding:0 10px;font-size:13px}
.add{width:100%;border:1px dashed var(--line);background:none;color:var(--mut);border-radius:10px;padding:11px;margin:8px 0 4px;font:inherit;font-size:14px;cursor:pointer}
.add:active{background:var(--soft)}
.total{display:flex;justify-content:space-between;font-weight:700;padding:10px 6px 4px;border-top:2px solid var(--ink);margin-top:4px}
textarea{width:100%;min-height:140px;resize:vertical;border:1px solid var(--line);padding:10px;line-height:1.5}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 4px 6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.empty{color:var(--mut);font-size:14px;padding:8px 6px}
.ro .add,.ro .del{display:none}
.msg{max-width:760px;margin:10px auto 0;padding:10px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:14px;display:none}
.msg.on{display:block}
select[data-s=Feito],select[data-s=Postado],select[data-s=Vendido]{color:var(--ok)}.sub2{font-size:13px;color:var(--mut);padding:2px 6px 4px;text-align:right}#s-vendas input.num{width:64px}select[data-s='Não interessado']{color:var(--bad)}select[data-s='A construir'],select[data-s=Interessado]{color:var(--acc)}
.out{border:0;background:none;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px}
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{max-width:360px;width:100%;text-align:center}
#gate h1{font-size:34px;margin-bottom:6px}#gate p{color:var(--mut);margin:0 0 22px}
.gbtn{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
#imp textarea{min-height:160px;font-size:12px;font-family:ui-monospace,monospace;margin-bottom:10px}
#imp .gbtn{margin-bottom:8px}
.proj h3{margin:12px 6px 2px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.proj .row textarea.st{flex:1;min-height:0;height:auto;border:0;padding:10px 6px;resize:none;overflow:hidden;font-size:15px;line-height:1.35;background:transparent}
.proj .row.done textarea.st{text-decoration:line-through;color:var(--mut)}
.proj .row{align-items:flex-start}.proj .row input[type=checkbox]{margin-top:12px}.proj .who2{margin-top:12px}.proj .del{margin-top:5px}
.proj .who2{flex:none;font-size:11px;color:var(--mut);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 8px;margin-right:4px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><div class="in"><h1>Web<span>Done</span></h1><div class="pill" id="st"><i></i><span>a ligar…</span></div><button class="out" id="out">Sair</button></div>
<div class="kpis"><div class="kpi"><b id="kHoje">–</b><span>Hoje</span></div><div class="kpi"><b id="kGastos">–</b><span>Gastos</span></div><div class="kpi"><b id="kGanho">–</b><span>Ganho</span></div><div class="kpi lu" id="kLu"><b id="kLucro">–</b><span>Lucro</span></div></div>
<div class="msg" id="msg"></div></div>
<main id="app"></main>
<div id="gate"><div class="box">
 <h1>Web<span style="color:var(--acc)">Done</span></h1>
 <div id="gLogin"><p>Painel da equipa</p><button class="gbtn" id="gBtn">Entrar com Google</button></div>
 <div id="gMsg" style="margin-top:14px;color:var(--mut);font-size:14px"></div>
 <div id="imp" class="hide"><p>Primeira vez: cola aqui os dados iniciais que o Claude te deu, ou começa vazio.</p>
  <textarea id="impTxt" placeholder='{"hoje":{...}}'></textarea>
  <button class="gbtn" id="impBtn">Importar dados</button><button class="gbtn" id="impSkip" style="background:none">Começar vazio</button></div>
</div></div>
<script>
{const l=document.createElement("link");l.rel="icon";l.href=document.getElementById("ati").href;document.head.appendChild(l)}
const SECS={
  hoje:{title:'Hoje',fields:['done','n','t'],ph:'tarefa',sort:(a,b)=>(+a.n||0)-(+b.n||0)||(a.o||0)-(b.o||0)},
  gastos:{title:'Gastos',fields:['t','v'],ph:'onde gastei'},
  clientes:{title:'Clientes possíveis',fields:['t','estado'],ph:'nome do cliente',opts:['Por contactar','Interessado','Não interessado','A construir','Feito']},
  vendas:{title:'Sites concluídos',fields:['t','v','estado'],ph:'site / cliente',opts:['Não vendido','Vendido']},
  precos:{title:'Preços',fields:['t','v'],ph:'o quê'},
  sites:{title:'Sites exemplares',fields:['t','estado'],ph:'nome do site',opts:['','Feito','Por postar','Postado']},
  redes:{title:'Redes sociais',fields:['t','r'],ph:'rede'}
};
const $=id=>document.getElementById(id);
let db=null,readOnly=false;
const store={},rows={},timers={},chains={};
function status(cls,t){const s=$('st');s.className='pill '+cls;s.lastElementChild.textContent=t}
function msg(t){const m=$('msg');m.textContent=t||'';m.className='msg'+(t?' on':'')}
function fail(e){
  if(e&&(e.code==='invalid_argument'||e.code==='permission-denied')){readOnly=true;document.body.classList.add('ro');msg('Sem permissão. Confirma que entraste com a conta webdonee@gmail.com.');status('err','só leitura')}
  else if(e&&e.code==='quota_exceeded'){msg('A base de dados está cheia.');status('err','cheia')}
  else status('err','erro – tenta de novo');
}
function queue(key,fn){chains[key]=(chains[key]||Promise.resolve()).then(fn).then(()=>status('on','guardado')).catch(fail);return chains[key]}

/* layout */
const app=$('app');
for(const k in SECS){
  const s=document.createElement('section');s.id='s-'+k;
  s.innerHTML=`<h2>${SECS[k].title}<em id="c-${k}"></em></h2>${k==='hoje'?'<div class="bar"><i id="bar"></i></div>':''}<div class="list" id="l-${k}"><div class="empty">A carregar…</div></div>${k==='gastos'?'<div class="total"><span>Total</span><span id="tot">0 €</span></div>':''}${k==='vendas'?'<div class="total"><span>Vendido</span><span id="totV">0 €</span></div><div class="sub2" id="totNV"></div>':''}<button class="add" data-k="${k}">+ adicionar</button>`;
  app.appendChild(s);store[k]={};rows[k]={};
}
const ps=document.createElement('section');ps.className='wide proj';ps.id='s-amen';ps.innerHTML='<h2>Projeto AMEN · próximos passos<em id="c-amen"></em></h2><div class="bar"><i id="barA"></i></div><div id="l-amen"><div class="empty">A carregar…</div></div><button class="add" id="addA">+ adicionar passo</button>';app.appendChild(ps);
const ns=document.createElement('section');ns.className='wide';ns.innerHTML='<h2>Notas</h2><textarea id="notas" placeholder="Escreve aqui…"></textarea>';app.appendChild(ns);

function makeRow(k,id){
  const S=SECS[k],r=document.createElement('div');r.className='row';r.dataset.id=id;
  for(const f of S.fields){
    let el;
    if(f==='done'){el=document.createElement('input');el.type='checkbox'}
    else if(f==='estado'){el=document.createElement('select');S.opts.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o||'—';el.appendChild(op)})}
    else{el=document.createElement('input');el.type='text';
      if(f==='v'){el.className='num';el.inputMode='decimal';el.placeholder='0'}
      else if(f==='n'){el.className='ord';el.inputMode='numeric'}
      else if(f==='r'){el.className='who';el.placeholder='quem'}
      else el.placeholder=S.ph;}
    el.dataset.f=f;
    el.addEventListener(f==='done'||f==='estado'?'change':'input',()=>edit(k,id,f,el));
    r.appendChild(el);
    if(f==='v'){const e=document.createElement('span');e.className='eur';e.textContent='€';r.appendChild(e)}
  }
  const d=document.createElement('button');d.className='del';d.textContent='✕';d.setAttribute('aria-label','apagar');
  d.addEventListener('click',()=>{
    if(!d.classList.contains('arm')){d.classList.add('arm');d.textContent='apagar?';setTimeout(()=>{d.classList.remove('arm');d.textContent='✕'},3000);return}
    status('','a apagar…');queue(k+id,()=>db.collection(k).doc(id).delete());
  });
  r.appendChild(d);return r;
}
function val(f,el){if(f==='done')return el.checked;if(f==='v'){const x=parseFloat(String(el.value).replace(',','.'));return isNaN(x)?0:x}if(f==='n'){const x=parseInt(el.value,10);return isNaN(x)?0:x}return el.value}
function edit(k,id,f,el){
  if(readOnly)return;
  const v=val(f,el);store[k][id]=Object.assign({},store[k][id],{[f]:v});
  if(f==='done')el.closest('.row').classList.toggle('done',v);
  if(f==='estado')el.dataset.s=v;
  kpis();status('','a guardar…');
  const key=k+id;timers[key]=timers[key]||{};timers[key].p=Object.assign(timers[key].p||{},{[f]:v});
  clearTimeout(timers[key].t);
  timers[key].t=setTimeout(()=>{const p=timers[key].p;timers[key].p=null;queue(key,()=>db.collection(k).doc(id).update(p))},f==='done'||f==='estado'?0:450);
}
function paint(k){
  const S=SECS[k],list=$('l-'+k),ids=Object.keys(store[k]);
  ids.sort((a,b)=>S.sort?S.sort(store[k][a],store[k][b]):(store[k][a].o||0)-(store[k][b].o||0));
  for(const id in rows[k])if(!store[k][id]){rows[k][id].remove();delete rows[k][id]}
  const em=list.querySelector('.empty');if(em)em.remove();
  for(const id of ids){
    const d=store[k][id];let r=rows[k][id];
    if(!r){r=rows[k][id]=makeRow(k,id);list.appendChild(r)}
    r.querySelectorAll('[data-f]').forEach(el=>{
      if(el===document.activeElement||(timers[k+id]&&timers[k+id].p&&el.dataset.f in timers[k+id].p))return;
      const f=el.dataset.f,v=d[f];
      if(f==='done')el.checked=!!v;else el.value=(v===undefined||v===null||(f==='v'&&v===0&&!el.value))?(f==='estado'?(S.opts[0]):''):v;
      if(f==='estado')el.dataset.s=el.value;
    });
    r.classList.toggle('done',!!d.done);
  }
  const cur=[...list.children].map(r=>r.dataset.id);
  if(cur.join()!==ids.join()&&!list.contains(document.activeElement))ids.forEach(id=>list.appendChild(rows[k][id]));
  if(!ids.length)list.innerHTML='<div class="empty">Nada ainda.</div>';
  kpis();
}

  const t=Object.values(store.gastos).reduce((a,x)=>a+(+x.v||0),0),ts=(Math.round(t*100)/100).toLocaleString('pt-PT')+' €';
  $('tot').textContent=ts;$('kGastos').textContent=ts;
  const eur=x=>(Math.round(x*100)/100).toLocaleString('pt-PT')+' €';
  const vs=Object.values(store.vendas),g=vs.filter(x=>x.estado==='Vendido').reduce((a,x)=>a+(+x.v||0),0),nv=vs.filter(x=>x.estado!=='Vendido');
  $('kGanho').textContent=eur(g);$('totV').textContent=eur(g);$('kLucro').textContent=eur(g-t);$('kLu').classList.toggle('neg',g-t<0);
  $('totNV').textContent=nv.length?nv.length+' por vender · '+eur(nv.reduce((a,x)=>a+(+x.v||0),0))+' em potencial':'';
  $('c-vendas').textContent=vs.length?vs.filter(x=>x.estado==='Vendido').length+' de '+vs.length+' vendidos':'';
  const c=Object.values(store.clientes);
  $('c-clientes').textContent=c.length?c.filter(x=>x.estado==='Feito').length+' feitos':'';
}

let amen=null,amenRef=null,amenT=null;
function amenSave(){if(readOnly||!amenRef)return;status('','a guardar…');clearTimeout(amenT);amenT=setTimeout(()=>queue('amen',()=>amenRef.set({items:amen})),350)}
function amenPaint(){
  const L=$('l-amen');if(!amen){return}
  if(L.contains(document.activeElement))return;
  L.innerHTML='';let g=null;
  amen.forEach((it,i)=>{
    if(it.g!==g){g=it.g;const h=document.createElement('h3');h.textContent=g||'Outros';L.appendChild(h)}
    const r=document.createElement('div');r.className='row'+(it.done?' done':'');
    const c=document.createElement('input');c.type='checkbox';c.checked=!!it.done;c.onchange=()=>{it.done=c.checked;r.classList.toggle('done',c.checked);amenKpi();amenSave()};
    const x=document.createElement('textarea');x.className='st';x.rows=1;x.value=it.t||'';x.placeholder='passo';const fit=()=>{x.style.height='auto';x.style.height=x.scrollHeight+'px'};x.oninput=()=>{it.t=x.value;fit();amenSave()};requestAnimationFrame(fit);
    const w=document.createElement('span');w.className='who2';w.textContent=it.w||'';if(!it.w)w.style.display='none';
    const d=document.createElement('button');d.className='del';d.textContent='✕';d.setAttribute('aria-label','apagar');
    d.onclick=()=>{if(!d.classList.contains('arm')){d.classList.add('arm');d.textContent='apagar?';setTimeout(()=>{d.classList.remove('arm');d.textContent='✕'},3000);return}amen.splice(i,1);amenPaint();amenSave()};
    r.append(c,x,w,d);L.appendChild(r);
  });
  if(!amen.length)L.innerHTML='<div class="empty">Nada ainda.</div>';
  amenKpi();
}
function amenKpi(){const n=amen.length,dn=amen.filter(x=>x.done).length;$('c-amen').textContent=n?dn+' de '+n:'';$('barA').style.width=(n?dn/n*100:0)+'%'}
$('addA').onclick=()=>{if(!amen||readOnly)return;const last=amen[amen.length-1];amen.push({g:last?last.g:'Outros',t:'',w:'',done:false,o:Date.now()});amenPaint();const ins=$('l-amen').querySelectorAll('textarea.st');ins[ins.length-1].focus();amenSave()};

window.startApp=function(adapter){
  if(db)return;db=adapter;
  let first=0;const need=Object.keys(SECS).length+2;
  const to=setTimeout(()=>{if(first<need){status('err','sem resposta');msg('Não consegui ligar à base de dados. Verifica a internet.')}},10000);
  const ok=()=>{if(++first>=need){clearTimeout(to);msg('')}status('on','ao vivo')};
  for(const k in SECS){
    db.collection(k).onSnapshot(s=>{
      const m={};s.docs.forEach(d=>{m[d.id]=Object.assign({},d.data())});
      for(const id in m){const p=timers[k+id]&&timers[k+id].p;if(p)Object.assign(m[id],p)}
      store[k]=m;paint(k);ok();
    },e=>fail(e));
  }
  amenRef=db.doc('meta/amen');
  amenRef.onSnapshot(s=>{
    if(!s.exists){amen=AMEN_DEF.map(x=>Object.assign({},x));amenPaint();if(!readOnly)queue('amen',()=>amenRef.set({items:amen}));ok();return}
    if(amenT&&!s.metadata.hasPendingWrites){}
    if(!s.metadata.hasPendingWrites){amen=(s.data().items||[]);amenPaint()}ok();
  },e=>fail(e));
  const nd=db.doc('meta/notas'),ta=$('notas');let nt;
  nd.onSnapshot(s=>{const v=(s.exists&&s.data().txt)||'';if(document.activeElement!==ta&&!nt)ta.value=v;ok()},e=>fail(e));
  ta.addEventListener('input',()=>{if(readOnly)return;status('','a guardar…');clearTimeout(nt);nt=setTimeout(()=>{nt=null;queue('notas',()=>nd.set({txt:ta.value}))},600)});
};
